name: Deploy to GitHub Pages

# 每次 push 上 main，就自動將最新版 App 部署去 GitHub Pages，
# 做 Vercel 之外嘅免費備份站。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 下載 repo
        uses: actions/checkout@v4
      - name: 設定 Pages
        uses: actions/configure-pages@v5
      - name: 上傳成個 repo 做網站內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 部署去 Pages
        id: deployment
        uses: actions/deploy-pages@v4
